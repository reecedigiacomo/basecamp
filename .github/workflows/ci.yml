# BaseCamp's own CI: runs the template self-test, which generates a Python, a Rust
# and a Godot project, so it needs all three toolchains. Separate from check.yml, which serves
# generated projects.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install just, uv, and jq
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo apt-get update
          sudo apt-get install -y jq
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # The template's pinned Godot version, the one generated projects get.
      - name: Install Godot
        run: |
          version=$(cat "template/{% if language == 'godot' %}.godot-version{% endif %}")
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/$version-stable/Godot_v$version-stable_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v$version-stable_linux.x86_64" "$HOME/.local/bin/godot"

      - name: just check
        run: just check
