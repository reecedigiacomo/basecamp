# BaseCamp's own CI: installs every language's tools, then runs `just check`, whose
# self-test generates and checks a project for every language in languages/.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A missing tool fails the self-test instead of skipping that language.
      SELF_TEST_ALL_LANGUAGES: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install just, uv, and jq
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          sudo apt-get update
          sudo apt-get install -y jq
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Each language's install steps, the same ones its generated projects' CI runs,
      # from its project folder so they read the files a generated project has.
      - name: Install every language's tools
        run: |
          for dir in languages/*/; do
            echo "== $dir"
            (cd "$dir/project" && bash -e ../ci-install)
          done

      - name: just check
        run: just check
