# Copier template for a new BaseCamp project. The core files live in template/, and each
# language's own files in languages/<language>/project/, which Copier renders as the
# project root. A symlink there named {{ '.' }} brings in template/ (see README).
_subdirectory: "languages/{{ language }}/project"
_min_copier_version: "9.0.0"
_message_after_copy: >-
  Next: read SETUP.md (https://github.com/{{ github_owner }}/basecamp/blob/main/SETUP.md)
  and finish the remaining steps.

# README.md is the project's own from the first commit on. Every other file,
# CLAUDE.md included, updates through Copier's normal 3-way merge.
_skip_if_exists:
  - README.md

# Asked first, so project_name can be checked against the chosen language.
language:
  type: str
  help: Language (one per project)
  choices:
    - python
    - rust
    - godot

# A name must be lowercase letters, digits and hyphens. A language may refuse more names
# in languages/<language>/name-check.jinja, for example ones the project couldn't
# import or build under.
project_name:
  type: str
  help: Project name (lowercase letters, digits and hyphens, starting with a letter)
  validator: >-
    {% if not (project_name | regex_search('^[a-z][a-z0-9-]*$')) or project_name.endswith('-') %}
    Use lowercase letters, digits and hyphens, starting with a letter and not ending with a hyphen.
    {% else %}
    {% include 'languages/' ~ language ~ '/name-check.jinja' ignore missing %}
    {% endif %}

description:
  type: str
  help: One-line description
  validator: >-
    {% if not description.strip() %}
    Give a one-line description.
    {% elif '\n' in description %}
    Keep the description to one line.
    {% endif %}

github_owner:
  type: str
  help: GitHub owner of the BaseCamp repo this project is made from
  validator: >-
    {% if not (github_owner | regex_search('^[A-Za-z0-9]([A-Za-z0-9-]{0,37}[A-Za-z0-9])?$')) %}
    Give the GitHub user or organization that owns the BaseCamp repo, such as octocat.
    {% endif %}

lfs:
  type: bool
  help: Track large assets with Git LFS?
  default: false

# Derived, never asked or recorded.
package_name:
  type: str
  when: false
  default: "{{ project_name | replace('-', '_') }}"
